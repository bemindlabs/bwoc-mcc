name: release

# Release the version already in `VERSION` on main: build a universal app
# bundle, tag it, publish a GitHub Release, and bump the Homebrew cask.
#
# The version is bumped beforehand through a normal PR
# (`scripts/bump-version.sh {patch|minor|major}`). `main` is protected, so this
# workflow never pushes to it — it only pushes the tag.
#
# Requires repo secret HOMEBREW_TAP_TOKEN: a PAT (or fine-grained token) with
# `contents: write` on bemindlabs/homebrew-tap.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    env:
      # `secrets` is not available in a step-level `if`, so the presence of the
      # token is surfaced here as a plain string the steps can test.
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run checks
        run: swift run CoreChecks

      - name: Read version
        id: version
        run: |
          V="$(tr -d '[:space:]' <VERSION)"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::v$V is already tagged — bump VERSION in a PR first (scripts/bump-version.sh)."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build universal app bundle
        id: bundle
        run: |
          ZIP="$(scripts/bundle-app.sh)"
          SHA="$(cat "$ZIP.sha256")"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Tag & push
        run: |
          V="${{ steps.version.outputs.version }}"
          git tag -a "v$V" -m "bwoc-mcc v$V"
          git push origin "v$V"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release create "v$V" --title "v$V" --generate-notes "${{ steps.bundle.outputs.zip }}"

      # The cask bump runs AFTER the irreversible tag/release push, so a missing
      # or expired HOMEBREW_TAP_TOKEN must not fail the run (which would mask a
      # successful release as red — issue #10). Guard both steps on the secret;
      # a final step prints a manual-bump notice when it's absent.
      - name: Checkout Homebrew tap
        if: ${{ env.HAS_TAP_TOKEN == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: bemindlabs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump Homebrew cask
        if: ${{ env.HAS_TAP_TOKEN == 'true' }}
        run: |
          V="${{ steps.version.outputs.version }}"
          SHA="${{ steps.bundle.outputs.sha }}"
          scripts/update-cask.sh tap/Casks/bwoc-mcc.rb "$V" "$SHA"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "bwoc-mcc: bump cask to v$V"
          git push

      - name: Cask bump skipped (no token)
        if: ${{ env.HAS_TAP_TOKEN != 'true' }}
        run: |
          V="${{ steps.version.outputs.version }}"
          echo "::warning::HOMEBREW_TAP_TOKEN not set — release v$V shipped, but the Homebrew cask was NOT auto-bumped."
          {
            echo "### ⚠️ Homebrew cask not bumped"
            echo "\`HOMEBREW_TAP_TOKEN\` is unset, so the cask auto-bump was skipped (the release itself succeeded)."
            echo ""
            echo "Set the secret (a PAT with \`contents: write\` on bemindlabs/homebrew-tap), or bump manually:"
            echo "\`\`\`sh"
            echo "scripts/update-cask.sh Casks/bwoc-mcc.rb $V <sha256-of-zip>"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
